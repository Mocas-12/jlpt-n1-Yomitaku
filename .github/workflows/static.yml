# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 冒烟测试：核心链路（筛选/作答/提交/导入校验）通过后才允许部署
  test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Validate question bank
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npx playwright test

  # Single deploy job since we're just deploying
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rewrite asset version params from content hash
        run: node scripts/version.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage site assets
        run: |
          mkdir -p _site
          cp -r index.html css js public manifest.webmanifest sw.js _site/
          # 自检：HTML 里的本地引用必须都存在于 _site
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("_site/index.html", "utf8");
            const refs = [...html.matchAll(/(?:src|href)="\.?\/?((?:css|js|public)[^"?]*)/g)].map((m) => m[1]);
            const missing = refs.filter((r) => !fs.existsSync("_site/" + r));
            if (missing.length) { console.error("缺少站点资源: " + missing.join(", ")); process.exit(1); }
          '
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
